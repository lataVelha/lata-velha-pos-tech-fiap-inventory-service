apiVersion: apps/v1
kind: Deployment
metadata:
  name: lata-velha-api
  namespace: lata-velha
  labels:
    app: lata-velha-api
    # O app ja usa o OTel Spring Boot Starter (SDK proprio). Sem este label,
    # o Admission Controller do Datadog injetaria o Datadog Java Agent
    # tambem — dupla instrumentacao (spans duplicados/conflito).
    admission.datadoghq.com/enabled: "false"
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lata-velha-api
  template:
    metadata:
      labels:
        app: lata-velha-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Espalha as réplicas entre nodes diferentes (melhor esforço)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: lata-velha-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: "${docker_image}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lata-velha-config
            - secretRef:
                name: lata-velha-db-secret
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/metrics"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: "http://$(HOST_IP):4318/v1/logs"
          # /tmp gravável para o work dir do Tomcat (FS raiz é read-only)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Aguarda o Spring Boot subir (até ~150s) antes das demais probes
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
      volumes:
        - name: tmp
          emptyDir: {}
