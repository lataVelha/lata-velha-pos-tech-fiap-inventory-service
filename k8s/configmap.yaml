apiVersion: v1
kind: ConfigMap
metadata:
  # Nome/namespace do PROPRIO inventory. Este arquivo era copia do os-service
  # (lata-velha-os-config / lata-velha-os) e o Deployment procura
  # lata-velha-inventory-config — o pod subia com CreateContainerConfigError.
  name: lata-velha-inventory-config
  namespace: lata-velha-inventory
data:
  ENVIRONMENT: "prod"
  # O inventory usa MongoDB (nao ha driver JDBC/JPA no classpath). As chaves
  # SPRING_DATASOURCE_*/SPRING_JPA_*/SPRING_FLYWAY_* que estavam aqui eram
  # herança do os-service e nao tinham efeito nenhum.
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/lata_velha_inventory"
  MONGOCK_ENABLED: "true"
  SPRING_MAIL_HOST: "smtp.gmail.com"
  SPRING_MAIL_PORT: "587"
  JWT_ISSUER: "lata-velha"
  JWT_EXPIRES_IN: "3600"
  OTEL_SERVICE_NAME: "lata-velha-inventory-service"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED: "true"
  # Variáveis OTel com $(HOST_IP) movidas para deployment.yaml (expansão correta)
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
  DEPLOYMENT_ENVIRONMENT_NAME: "prod"
  SERVICE_VERSION: "${service_version}"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=prod,service.version=${service_version},service.name=lata-velha-inventory-service"
  MESSAGING_PROVIDER: "sqs"
  MESSAGING_SQS_REGION: "us-east-1"
  MESSAGING_SQS_TOPIC_ARN: "${messaging_topic_arn}"
  MESSAGING_SQS_QUEUE_URL: "${messaging_queue_url}"
