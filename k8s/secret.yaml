# Valores _b64 preenchidos pelo Terraform (templatefile) — nada de segredo versionado aqui.
# NOTA: o inventory-service usa MongoDB, nao JDBC. As chaves SPRING_DATASOURCE_*
# sao inertes (nao existe driver JDBC/JPA no classpath) e ficam aqui apenas porque
# o modulo terraform ainda passa db_url/db_username/db_password. A conexao real do
# Mongo vem de SPRING_DATA_MONGODB_URI no configmap.
apiVersion: v1
kind: Secret
metadata:
  name: lata-velha-inventory-secret
  namespace: lata-velha-inventory
type: Opaque
data:
  SPRING_DATASOURCE_URL: "${db_url_b64}"
  SPRING_DATASOURCE_USERNAME: "${db_username_b64}"
  SPRING_DATASOURCE_PASSWORD: "${db_password_b64}"
  SPRING_MAIL_USERNAME: "${mail_username_b64}"
  SPRING_MAIL_PASSWORD: "${mail_password_b64}"
  DD_API_KEY: "${dd_api_key_b64}"
