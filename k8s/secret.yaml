# Valores _b64 preenchidos pelo Terraform (templatefile) — nada de segredo versionado aqui.
# O inventory usa MongoDB: a conexao real vem de SPRING_DATA_MONGODB_URI no
# configmap. Nao ha mais credenciais JDBC/Postgres neste secret.
apiVersion: v1
kind: Secret
metadata:
  name: lata-velha-inventory-secret
  namespace: lata-velha-inventory
type: Opaque
data:
  SPRING_MAIL_USERNAME: "${mail_username_b64}"
  SPRING_MAIL_PASSWORD: "${mail_password_b64}"
  DD_API_KEY: "${dd_api_key_b64}"
