services:
  inventory-service:
    container_name: lata-velha-inventory-service-local
    build: "."
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-docker}
      DD_API_KEY: ${DD_API_KEY}
      OTEL_SERVICE_NAME: lata-velha-inventory-service
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=docker,service.version=0.0.1,service.name=lata-velha-inventory-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://datadog-agent:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://datadog-agent:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://datadog-agent:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://datadog-agent:4318/v1/logs
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
      DEPLOYMENT_ENVIRONMENT_NAME: docker
      SERVICE_VERSION: 0.0.1
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/lata_velha_inventory?authSource=admin
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      JWT_ISSUER: lata-velha
      JWT_EXPIRES_IN: "3600"
    depends_on:
      mongodb:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - lata_velha_inventory_local

  mongodb:
    image: mongo:7
    container_name: mongodb-lata-velha-inventory-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: lata_velha_inventory
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_inventory_data_local:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lata_velha_inventory_local

  datadog-agent:
    image: datadog/agent:7
    container_name: lata-velha-inventory-datadog
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: us5.datadoghq.com
      DD_HOSTNAME: lata-velha-inventory-docker
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: 0.0.0.0:4317
      DD_LOGS_ENABLED: "true"
      DD_OTLP_CONFIG_LOGS_ENABLED: "true"
      DD_APM_FEATURES: "enable_operation_and_resource_name_logic_v2"
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
      DD_PROCESS_CONFIG_CONTAINER_COLLECTION_ENABLED: "false"
      DD_PROCESS_CONFIG_LOG_COLLECTION_ENABLED: "false"
      DD_SYSTEM_PROBE_ENABLED: "false"
      DD_SECURITY_AGENT_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4318:4318"
      - "4317:4317"
      - "8126:8126"
    networks:
      - lata_velha_inventory_local

volumes:
  mongo_inventory_data_local:

networks:
  lata_velha_inventory_local:
