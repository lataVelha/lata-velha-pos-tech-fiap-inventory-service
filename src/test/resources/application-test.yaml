spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

jwt:
  public:
    key: classpath:app.pub
  issuer: mybackend

otel:
  exporter:
    otlp:
      enabled: false
  instrumentation:
    logback-appender:
      enabled: false

# O @EnableMongock (MongockConfig) tentaria conectar no MongoDB no boot do
# contexto de teste — não há Mongo em CI. Desliga no profile de teste.
mongock:
  enabled: false